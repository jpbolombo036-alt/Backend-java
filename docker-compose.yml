version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: itaccess-db
    restart: always
    environment:
      POSTGRES_DB: itaccessdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: itaccess-backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/itaccessdb
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - JWT_SECRET=votre_secret_tres_long_et_securise_ici
      - UPLOAD_DIR=/app/uploads/attachments
      # Backblaze B2 Storage (DocumentArchive) - laisser desactive en local par defaut
      - B2_ENABLED=false
      - B2_KEY_ID=your-b2-key-id
      - B2_APPLICATION_KEY=your-b2-application-key
      - B2_BUCKET=taccess-storage
      - B2_ENDPOINT=https://s3.us-east-005.backblazeb2.com
    volumes:
      - ./uploads:/app/uploads

volumes:
  uploads: