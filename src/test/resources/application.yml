spring:
  datasource:
    url: jdbc:h2:mem:itaccess_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: localhost
    port: 2525
    username: test
    password: test

app:
  jwt:
    secret: test-jwt-secret-key-with-enough-length-for-hs256-algorithm
    expiration: 86400000
  cors:
    allowed-origins: http://localhost:3000
  frontend:
    url: http://localhost:3000
  upload:
    dir: ./target/test-uploads
  security:
    require-activation: false
    admin-init-key: test-admin-init-key

logging:
  level:
    com.itaccess: WARN
    org.springframework: WARN
