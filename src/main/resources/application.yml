spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/itaccessdb}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: true

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:your-email@gmail.com}
    password: ${SMTP_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:noreply@itaccess.local}

  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

server:
  port: ${SERVER_PORT:${PORT:8000}}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://it-testerkansa.vercel.app,https://it-testerkansa-omega.vercel.app,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://localhost:8080,http://127.0.0.1:8080,http://localhost:4200,http://127.0.0.1:4200,http://localhost:8000,itaccess-backend-production-5145.up.railway.app,http://127.0.0.1:8000}

  jwt:
    secret: ${JWT_SECRET:please-change-this-in-production-use-a-secure-random-key-at-least-256-bits}
    expiration: 86400000

  security:
    require-activation: true
    max-login-attempts: 5
    lockout-duration-minutes: 15
    admin-init-key: ${ADMIN_INIT_KEY:IT_ACCESS_INIT_2024_SECURE_KEY_CHANGE_ME}

  frontend:
    url: ${FRONTEND_URL:https://it-testerkansa-omega.vercel.app}

  upload:
    dir: ${UPLOAD_DIR:/tmp/uploads/apk}
    attachments-dir: ${ATTACHMENTS_DIR:/tmp/uploads/attachments}
    document-archive-dir: ${DOCUMENT_ARCHIVE_DIR:/tmp/uploads/documents}
    max-file-size: ${MAX_FILE_SIZE:150MB}

  storage:
    b2:
      enabled: ${B2_ENABLED:false}
      key-id: ${B2_KEY_ID:}
      application-key: ${B2_APPLICATION_KEY:}
      bucket: ${B2_BUCKET:itaccess-storage}
      endpoint: ${B2_ENDPOINT:https://s3.us-east-005.backblazeb2.com}
      region: ${B2_REGION:us-east-005}
      documents-prefix: ${B2_DOCUMENTS_PREFIX:document-archive/}

  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o}
    max-tokens: ${OPENAI_MAX_TOKENS:1000}

logging:
  level:
    com.itaccess: ${LOG_LEVEL:INFO}